services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coordinator
      POSTGRES_PASSWORD: coordinator
      POSTGRES_DB: coordinator
    ports:
      - '5432:5432'
    volumes:
      - coordinator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coordinator -d coordinator']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  coordinator_pgdata:
